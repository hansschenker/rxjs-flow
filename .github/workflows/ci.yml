name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test Node and DOM
        run: npm test

      - name: Test in workerd
        run: npm run test:worker

      - name: Check generated Worker types
        run: npm run cf:typecheck

      - name: Build browser and Worker
        run: npm run build:worker

      - name: Smoke test local Worker preview
        timeout-minutes: 3
        run: npm run smoke:worker

      - name: Smoke test local Worker Todo API
        timeout-minutes: 3
        run: npm run smoke:worker -- --dev

      - name: Verify durable Todo process restart
        timeout-minutes: 3
        run: node scripts/m05c-checkpoint.mjs --preview

      - name: Verify owned live streams in development
        timeout-minutes: 3
        run: node scripts/m05d-checkpoint.mjs

      - name: Verify owned live streams in built Worker
        timeout-minutes: 3
        run: node scripts/m05d-checkpoint.mjs --preview

      - name: Verify built same-origin delivery and versioned resnapshot
        timeout-minutes: 3
        run: node scripts/m09-delivery-checkpoint.mjs
